# One P2PSec node for one person. Use the same file on every device.
#   Easiest: scripts/start.ps1 (Windows) or scripts/start.sh (macOS/Linux)
#   By hand: LAN_IP=<this device's Wi-Fi address> docker compose up -d
# Then open http://127.0.0.1:8000 and sign in as user / user (change it in Node settings).
# "Demo mode" on the sign-in page starts a seeded six-person team inside this same container.
name: p2psec

services:
  p2psec:
    image: ghcr.io/shreyasdr71/peasec:latest
    build: .
    pull_policy: missing        # use a pulled or built image if present, otherwise build it
    restart: unless-stopped
    environment:
      NODE_ID: node
      ADVERTISE_ADDR: "${LAN_IP:-127.0.0.1}:7600"     # how other devices reach your node
      TOM_ADVERTISE: "${LAN_IP:-127.0.0.1}:7606"      # how other devices reach the demo Tom
    ports:
      - "127.0.0.1:8000:8000"   # web UI: this computer only
      - "0.0.0.0:7600:7600"     # your node, for teammates on the same network
      - "0.0.0.0:7606:7606"     # demo Tom (only listening while demo mode is on)
    volumes:
      - data:/data

volumes:
  data: {}
